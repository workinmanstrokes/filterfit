# FilterFit — Android debug APK build.
#
# Generates the native Android platform fresh from this repo (android/ is
# NOT committed — see .gitignore), builds the debug APK, and uploads it as
# an artifact. Download it from the workflow run's Artifacts section and
# sideload it on an Android phone. No Play Store account or signing key is
# needed for a debug APK.
#
# FIX 2026-11-21: do NOT use android-actions/setup-android — it tries to
# install the obsolete "tools" package and fails on modern cmdline-tools
# (run #1 failed on `sdkmanager tools`). The ubuntu runner already has the
# Android SDK preinstalled; install only valid packages with sdkmanager.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 35
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android platform
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: filterfit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
