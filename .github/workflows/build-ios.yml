# FilterFit — iOS native build (UNSIGNED).
#
# Generates the native iOS platform fresh from this repo (ios/ is NOT
# committed — see .gitignore) and builds the app with xcodebuild without
# signing (CODE_SIGNING_ALLOWED=NO). This proves the native iOS project
# builds. An unsigned .app CANNOT be installed on a real iPhone — that needs
# an Apple Developer account ($99/year) plus a signing certificate and a
# provisioning profile, via Xcode or TestFlight.
#
# FIX 2026-11-21: -target cannot be used with a workspace, and
# -derivedDataPath requires -scheme (run #1 failed with exit 64).
# Capacitor's iOS template ships no shared scheme file, so the workflow
# creates one for the App target (ID read from project.pbxproj) when it is
# missing, then builds by scheme.
name: Build iOS (unsigned)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync iOS platform
        run: npx cap sync ios

      - name: Create shared scheme (if missing)
        run: |
          python3 - <<'PYEOF'
          import pathlib, re, textwrap
          scheme = pathlib.Path("ios/App/App.xcworkspace/xcshareddata/xcschemes/App.xcscheme")
          if scheme.exists():
              print("Scheme already exists, keeping it.")
              raise SystemExit(0)
          pbx = pathlib.Path("ios/App/App.xcodeproj/project.pbxproj").read_text()
          m = re.search(r"([0-9A-F]{24}) /\* App \*/ = \{\s*isa = PBXNativeTarget;.*?name = App;", pbx, re.S)
          if not m:
              raise SystemExit("App target not found in project.pbxproj")
          tid = m.group(1)
          xml = textwrap.dedent(f'''\
              <?xml version="1.0" encoding="UTF-8"?>
              <Scheme
                 LastUpgradeVersion = "1600"
                 version = "1.7">
                 <BuildAction
                    parallelizeBuildables = "YES"
                    buildImplicitDependencies = "YES"
                    runPostActionsOnFailure = "NO">
                    <BuildActionEntries>
                       <BuildActionEntry
                          buildForTesting = "YES"
                          buildForRunning = "YES"
                          buildForProfiling = "YES"
                          buildForArchiving = "YES"
                          buildForAnalyzing = "YES">
                          <BuildableReference
                             BuildableIdentifier = "primary"
                             BlueprintIdentifier = "{tid}"
                             BuildableName = "App.app"
                             BlueprintName = "App"
                             ReferencedContainer = "container:App.xcodeproj">
                          </BuildableReference>
                       </BuildActionEntry>
                    </BuildActionEntries>
                 </BuildAction>
                 <TestAction
                    buildConfiguration = "Debug"
                    selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                    selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                    shouldUseLaunchSchemeArgsEnv = "YES">
                 </TestAction>
                 <LaunchAction
                    buildConfiguration = "Debug"
                    selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB"
                    selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB"
                    launchStyle = "0"
                    useCustomWorkingDirectory = "NO"
                    ignoresPersistentStateOnLaunch = "NO"
                    debugDocumentVersioning = "YES"
                    debugServiceExtension = "internal"
                    allowLocationSimulation = "YES">
                 </LaunchAction>
                 <ProfileAction
                    buildConfiguration = "Release"
                    shouldUseLaunchSchemeArgsEnv = "YES"
                    savedToolIdentifier = ""
                    useCustomWorkingDirectory = "NO"
                    debugDocumentVersioning = "YES">
                 </ProfileAction>
                 <AnalyzeAction
                    buildConfiguration = "Debug">
                 </AnalyzeAction>
                 <ArchiveAction
                    buildConfiguration = "Release"
                    revealArchiveInOrganizer = "YES">
                 </ArchiveAction>
              </Scheme>
              ''')
          scheme.parent.mkdir(parents=True, exist_ok=True)
          scheme.write_text(xml)
          print(f"Wrote shared scheme for App target {tid}")
          PYEOF

      - name: Build app (no signing)
        run: >-
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App
          -configuration Debug -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath ios/App/build
          CODE_SIGNING_ALLOWED=NO build

      - uses: actions/upload-artifact@v4
        with:
          name: filterfit-ios-unsigned
          path: ios/App/build/Build/Products/Debug-iphoneos/App.app
          if-no-files-found: error
